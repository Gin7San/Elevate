services:
  postgres:
    image: postgres:16-alpine
    container_name: interviewsense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: interviewsense
      POSTGRES_USER: interviewsense
      POSTGRES_PASSWORD: interviewsense_dev
    ports:
      - "5432:5432"
    volumes:
      - interviewsense_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewsense -d interviewsense"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    container_name: interviewsense-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://interviewsense:interviewsense_dev@postgres:5432/interviewsense?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the shell or an .env file before running the full stack}
      PORT: 4000
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: interviewsense-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  interviewsense_pgdata:
